<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWA Calculator</title>
</head>
<body>

    <h1>GWA Calculator</h1>

    <div id="subjects">
        <div class="subject">
            <input type="text" placeholder="Subject Name" class="name">
            <input type="number" placeholder="Grade" class="grade" step="0.01">
            <input type="number" placeholder="Units" class="units">
        </div>
    </div>

    <button onclick="addSubject()">Add Subject</button>
    <button onclick="calculate()">Calculate GWA</button>

    <h2 id="result"></h2>
    <p id="error"></p>

    <p>Version: <span id="version">Loading...</span></p>

    <script>
        function addSubject() {
            const container = document.getElementById("subjects");

            const div = document.createElement("div");
            div.className = "subject";

            div.innerHTML = `
                <input type="text" placeholder="Subject Name" class="name">
                <input type="number" placeholder="Grade" class="grade" step="0.01">
                <input type="number" placeholder="Units" class="units">
            `;

            container.appendChild(div);
        }

        async function calculate() {
            const rows = document.querySelectorAll(".subject");
            const subjects = [];

            rows.forEach(row => {
                subjects.push({
                    name: row.querySelector(".name").value,
                    grade: Number(row.querySelector(".grade").value),
                    units: Number(row.querySelector(".units").value)
                });
            });

            try {
                const response = await fetch("/api/calculate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ subjects })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error);
                }

                document.getElementById("result").textContent =
                    "Your GWA is: " + data.gwa;

                document.getElementById("error").textContent = "";

            } catch (error) {
                document.getElementById("error").textContent =
                    error.message;

                document.getElementById("result").textContent = "";
            }
        }

        fetch("/health")
            .then(response => response.json())
            .then(data => {
                document.getElementById("version").textContent =
                    data.version;
            });
    </script>

    <footer>
        <p>GWA Calculator</p>
    </footer>

</body>
</html>
